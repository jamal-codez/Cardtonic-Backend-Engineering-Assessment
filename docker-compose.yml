services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: borderless
      POSTGRES_PASSWORD: borderless
      POSTGRES_DB: borderless
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U borderless -d borderless']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://borderless:borderless@postgres:5432/borderless
      DB_POOL_MAX: '10'
      SCHEDULERS_ENABLED: 'true'
      REQUEST_TIMEOUT_MS: '10000'
      MAX_TX_AMOUNT: '1000000000'
      IDEMPOTENCY_TTL_HOURS: '24'
      FX_PROVIDER: 'simulated'
      RECON_INTERVAL_MS: '300000'
      RECON_OVERLAP_MS: '300000'
      RECON_FREEZE_ON_DRIFT: 'false'
      FX_REFRESH_INTERVAL_MS: '54000'
      FX_SIM_SMALL_STEP_PCT: '0.3'
      FX_SIM_MEDIUM_STEP_PCT: '1.5'
      FX_SIM_BAND_PCT: '30'
      FX_MAX_MOVE_PCT: '20'
      FX_QUOTE_TTL_MS: '30000'
    ports:
      - '3000:3000'

volumes:
  pgdata:
